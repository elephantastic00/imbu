<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMBU Networking</title>

<style>

@font-face {
    font-family: 'MinervaModern';
    src: url('./fonts/fonnts.com-MinervaModern_Regular.otf') format('opentype');
}

@font-face {
    font-family: 'Montserrat';
    src: url('fonts/Montserrat-Regular.ttf') format('truetype');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
        radial-gradient(circle at 15% 10%, rgba(207,224,171,.75), transparent 25%),
        radial-gradient(circle at 85% 15%, rgba(203,220,175,.75), transparent 22%),
        radial-gradient(circle at 10% 90%, rgba(189,219,156,.65), transparent 25%),
        radial-gradient(circle at 90% 90%, rgba(208,223,245,.75), transparent 25%),
        #f8f6f0;

    color:#355541;
}

.container{

    max-width:430px;
    margin:auto;

    padding-top:10px;
    padding-bottom:30px;
    padding-left:18px;
    padding-right:18px;
}

.logo{
    text-align:center;
    margin-bottom:10px;
}

.logo img{
    width:270px;
    max-width:100%;
}

.button{

    display:flex;
    align-items:center;

    text-decoration:none;
    color:#355541;

    border:2px solid #355541;
    border-radius:999px;

    min-height:92px;

    margin-bottom:14px;

    overflow:hidden;

    transition:0.2s ease;
}

.button:hover{
    transform:translateY(-2px);
}

.number{

    width:70px;
    height:70px;

    min-width:70px;

    margin-left:6px;

    border-radius:50%;

    background:#ffffff;

    border:2px solid #355541;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'MinervaModern', serif;
    font-size:32px;
}

.info{
    padding-left:18px;
}

.name{

    font-family:'MinervaModern', serif;

    font-size:30px;
    line-height:0.95;

    color:#355541;
}

.role{

    font-family:'Montserrat', sans-serif;

    font-size:16px;
    font-weight:400;

    margin-top:4px;

    letter-spacing:0.02em;

    color:#355541;
}

.green{
    background:
    linear-gradient(
        90deg,
        #c9dd87 0%,
        #d9e7aa 45%,
        #e8edd0 75%,
        #f7f4ea 100%
    );
}

.blue{
    background:
    linear-gradient(
        90deg,
        #cfe08f 0%,
        #d8e4ad 40%,
        #d8e5ee 70%,
        #dbe7f7 100%
    );
}

.yellow{
    background:
    linear-gradient(
        90deg,
        #cfe08f 0%,
        #d8e4ad 40%,
        #e7e3ad 70%,
        #efe29a 100%
    );
}

@media(max-width:430px){

    .logo img{
        width:240px;
    }

    .name{
        font-size:26px;
    }

    .role{
        font-size:16px;
    }

    .button{
        min-height:86px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="IMBU">
    </div>

    <a class="button green" href="https://www.linkedin.com/in/shuru-qian-693796379" target="_blank" rel="noopener noreferrer">
        <div class="number">1</div>
        <div class="info">
            <div class="name">Shuru Qian</div>
            <div class="role">Purify</div>
        </div>
    </a>

    <a class="button green" href="https://www.linkedin.com/in/yanting-huang-a2a840320/" target="_blank" rel="noopener noreferrer">
        <div class="number">2</div>
        <div class="info">
            <div class="name">Yanting Huang</div>
            <div class="role">Revitalise</div>
        </div>
    </a>

    <a class="button green" href="https://www.linkedin.com/in/alice-z-591b67188/" target="_blank" rel="noopener noreferrer">
    <div class="number">3</div>
    <div class="info">
        <div class="name">Alice Zhang</div>
        <div class="role">Nourish</div>
    </div>
</a>

    <a class="button blue" href="#">
        <div class="number">4</div>
        <div class="info">
            <div class="name">Qiwen Zheng</div>
            <div class="role">Repair</div>
        </div>
    </a>

    <a class="button yellow" href="https://www.linkedin.com/in/xihua-zheng" target="_blank" rel="noopener noreferrer">
        <div class="number">5</div>
        <div class="info">
            <div class="name">Xihua Zheng</div>
            <div class="role">Protect</div>
        </div>
    </a>

    <a class="button green" href="https://www.linkedin.com/in/xinyang-shi-959653418/" target="_blank" rel="noopener noreferrer">
        <div class="number">6</div>
        <div class="info">
            <div class="name">Xinyang Shi</div>
            <div class="role">Soothe</div>
        </div>
    </a>

    <a class="button green" href="#">
        <div class="number">7</div>
        <div class="info">
            <div class="name">Ruby Guttmann</div>
            <div class="role">Designer (MADA)</div>
        </div>
    </a>

</div>

</body>
</html>
