<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMBU Cosmetics</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #faf8f5 0%, #f2eee8 100%);
    color: #2b2b2b;
    min-height: 100vh;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 40px 20px 60px;
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo h1 {
    font-size: 2rem;
    letter-spacing: 2px;
}

.tagline {
    text-align: center;
    color: #666;
    margin-bottom: 40px;
    line-height: 1.5;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.name {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 8px;
}

.role {
    color: #777;
    margin-bottom: 15px;
}

.linkedin {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #0A66C2;
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
}

.linkedin:hover {
    opacity: 0.9;
}

.footer {
    text-align: center;
    margin-top: 30px;
}

.website {
    display: block;
    background: #2b2b2b;
    color: white;
    text-decoration: none;
    padding: 16px;
    border-radius: 14px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>IMBU</h1>
    </div>

    <div class="tagline">
        Innovative cosmetic formulation and manufacturing solutions.
    </div>

    <div class="card">
        <div class="name">Alice Zhang</div>
        <div class="role">Formulation Scientist</div>
        <a class="linkedin" href="https://linkedin.com">
            Connect on LinkedIn
        </a>
    </div>

    <div class="card">
        <div class="name">Team Member</div>
        <div class="role">Business Development</div>
        <a class="linkedin" href="https://linkedin.com">
            Connect on LinkedIn
        </a>
    </div>

    <div class="card">
        <div class="name">Team Member</div>
        <div class="role">Research & Development</div>
        <a class="linkedin" href="https://linkedin.com">
            Connect on LinkedIn
        </a>
    </div>

    <div class="footer">
        <a class="website" href="#">
            Visit Company Website
        </a>
    </div>

</div>

</body>
</html>
