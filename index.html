<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMBU Networking</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Georgia, serif;
    min-height:100vh;

    background:
        radial-gradient(circle at 15% 10%, rgba(207,224,171,.9), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(192,220,160,.8), transparent 22%),
        radial-gradient(circle at 15% 90%, rgba(191,219,155,.7), transparent 25%),
        radial-gradient(circle at 85% 90%, rgba(203,220,244,.8), transparent 25%),
        #f8f7f1;

    color:#355541;
}

.container{
    max-width:420px;
    margin:auto;
    padding:25px 18px 40px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:240px;
    max-width:100%;
}

.button{
    display:flex;
    align-items:center;

    text-decoration:none;
    color:#355541;

    border:2px solid #355541;
    border-radius:999px;

    background:#f6f4eb;

    min-height:82px;
    margin-bottom:16px;

    overflow:hidden;

    transition:.2s ease;
}

.button:hover{
    transform:translateY(-2px);
}

.number{
    width:68px;
    height:68px;

    min-width:68px;

    border-radius:50%;

    background:#ffffff;
    border:2px solid #355541;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-left:6px;

    font-size:30px;
}

.info{
    padding-left:18px;
    padding-right:15px;
}

.name{
    font-size:20px;
    line-height:1.1;
}

.role{
    font-size:14px;
    margin-top:4px;
}

.green{
    background:
      linear-gradient(90deg,#d6e4a7 0%,#f6f4eb 25%);
}

.blue{
    background:
      linear-gradient(90deg,#d8e6d5 0%,#dbe9fb 100%);
}

.yellow{
    background:
      linear-gradient(90deg,#d7e3a8 0%,#f2e6a3 100%);
}

@media (max-width:480px){

    .container{
        padding:20px 14px 30px;
    }

    .name{
        font-size:18px;
    }

    .role{
        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="IMBU">
    </div>

    <a class="button green" href="#">
        <div class="number">1</div>
        <div class="info">
            <div class="name">Shuru Qian</div>
        </div>
    </a>

    <a class="button green" href="#">
        <div class="number">2</div>
        <div class="info">
            <div class="name">Yanting Huang</div>
        </div>
    </a>

    <a class="button green" href="#">
        <div class="number">3</div>
        <div class="info">
            <div class="name">Alice Zhang</div>
        </div>
    </a>

    <a class="button blue" href="#">
        <div class="number">4</div>
        <div class="info">
            <div class="name">Qiwen Zheng</div>
        </div>
    </a>

    <a class="button yellow" href="#">
        <div class="number">5</div>
        <div class="info">
            <div class="name">Xihua Zheng</div>
        </div>
    </a>

    <a class="button green" href="#">
        <div class="number">6</div>
        <div class="info">
            <div class="name">Xinyang Shi</div>
        </div>
    </a>

    <a class="button green" href="#">
        <div class="number">7</div>
        <div class="info">
            <div class="name">Ruby Guttmann</div>
            <div class="role">Designer (MADA)</div>
        </div>
    </a>

</div>

</body>
</html>
